<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="iconapp.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIVATE MODE</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #ff1500;
      font-family: 'ZCOOL QingKe HuangYou', cursive;
      text-align: center;
    }

    #logo {
      width: 70%;
      max-width: 100%;
      margin: 20px auto;
      display: block;
    }

    .game-container {
      display: none;
      margin: 20px auto;
      max-width: 1750px;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #0c0c0c;
    }

    #twegallery-p-container canvas {
      width: 90%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    #Mtwegallery-p-container canvas {
      width: 90%;
      height: auto;
      aspect-ratio: 9 / 16;
    }

    .loading-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90px;
      height: 90px;
      transform: translate(-50%, -50%);
      animation: spin 4s linear infinite;
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>

  <img id="logo" src="twegall-logo.png" alt="Logo">

  <!-- Desktop Game -->
  <div id="twegallery-p-container" class="game-container">
    <img src="loading-logo.png" class="loading-logo" id="desktop-loading-logo" alt="Loading">
    <canvas id="twegallery-p-canvas"></canvas>
  </div>

  <!-- Mobile Game -->
  <div id="Mtwegallery-p-container" class="game-container">
    <img src="loading-logo.png" class="loading-logo" id="mobile-loading-logo" alt="Loading">
    <canvas id="Mtwegallery-p-canvas"></canvas>
  </div>

  <script>
    let unityInstance = null;
    let currentPlatform = null;
    let currentLoaderScript = null;

    function initUnity(canvasId, loaderUrl, dataUrl, frameworkUrl, codeUrl, productName, logoId) {
      return new Promise((resolve, reject) => {
        const canvas = document.getElementById(canvasId);
        const loadingLogo = document.getElementById(logoId);

        if (!canvas) {
          reject(new Error("Canvas not found: " + canvasId));
          return;
        }

        if (!loadingLogo) {
          reject(new Error("Loading logo not found: " + logoId));
          return;
        }

        loadingLogo.style.display = "block";

        const loaderScript = document.createElement("script");
        loaderScript.src = loaderUrl;
        loaderScript.async = true;

        loaderScript.onload = () => {
          if (typeof createUnityInstance !== "function") {
            reject(new Error("createUnityInstance is not available after loading " + loaderUrl));
            return;
          }

          createUnityInstance(canvas, {
            dataUrl: dataUrl,
            frameworkUrl: frameworkUrl,
            codeUrl: codeUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: productName,
            productVersion: "0.1"
          })
          .then(instance => {
            unityInstance = instance;
            currentLoaderScript = loaderScript;
            loadingLogo.style.display = "none";
            resolve(instance);
          })
          .catch(error => {
            loadingLogo.style.display = "none";
            reject(error);
          });
        };

        loaderScript.onerror = () => {
          loadingLogo.style.display = "none";
          reject(new Error("Failed to load Unity loader: " + loaderUrl));
        };

        document.body.appendChild(loaderScript);
      });
    }

    function unloadUnity() {
      if (unityInstance) {
        unityInstance.Quit();
        unityInstance = null;
      }

      if (currentLoaderScript) {
        currentLoaderScript.remove();
        currentLoaderScript = null;
      }
    }

<script>
let unityInstance = null;
let currentPlatform = null;

function initUnity(canvasId, loaderUrl, dataUrl, frameworkUrl, codeUrl, productName, logoId) {
    return new Promise((resolve, reject) => {
        const canvas = document.getElementById(canvasId);
        const loadingLogo = document.getElementById(logoId);

        if (!canvas) {
            reject("Canvas not found: " + canvasId);
            return;
        }

        if (!loadingLogo) {
            reject("Loading logo not found: " + logoId);
            return;
        }

        loadingLogo.style.display = "block";

        const loaderScript = document.createElement("script");
        loaderScript.src = loaderUrl;

        loaderScript.onload = () => {
            createUnityInstance(canvas, {
                dataUrl: dataUrl,
                frameworkUrl: frameworkUrl,
                codeUrl: codeUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: productName,
                productVersion: "0.1"
            }).then(instance => {
                unityInstance = instance;
                loadingLogo.style.display = "none";
                resolve(instance);
            }).catch(err => {
                console.error("Unity failed to load:", err);
                reject(err);
            });
        };

        loaderScript.onerror = () => {
            reject("Failed to load loader script: " + loaderUrl);
        };

        document.body.appendChild(loaderScript);
    });
}

function unloadUnity() {
    if (unityInstance) {
        unityInstance.Quit();
        unityInstance = null;
    }
}

function checkScreen() {
    const width = window.innerWidth;

    const desktopContainer = document.getElementById("twegallery-p-container");
    const mobileContainer = document.getElementById("Mtwegallery-p-container");

    if (width > 768) {
        if (desktopContainer) desktopContainer.style.display = "block";
        if (mobileContainer) mobileContainer.style.display = "none";

        if (currentPlatform !== "desktop") {
            unloadUnity();
            initUnity(
                "twegallery-m-canvas",
                "twegallery-m.loader.js",
                "twegallery-m.data",
                "twegallery-m.framework.js",
                "twegallery-m.wasm",
                "twegallery-m",
                "desktop-loading-logo"
            ).catch(console.error);

            currentPlatform = "desktop";
        }
    } else {
        if (desktopContainer) desktopContainer.style.display = "none";
        if (mobileContainer) mobileContainer.style.display = "block";

        if (currentPlatform !== "mobile") {
            unloadUnity();
            initUnity(
                "Mtwegallery-m-canvas",
                "Mtwegallery-m.loader.js",
                "Mtwegallery-m.data",
                "Mtwegallery-m.framework.js",
                "Mtwegallery-m.wasm",
                "Mtwegallery-m",
                "mobile-loading-logo"
            ).catch(console.error);

            currentPlatform = "mobile";
        }
    }
}

checkScreen();
window.addEventListener("resize", checkScreen);
</script>

</body>
</html>
