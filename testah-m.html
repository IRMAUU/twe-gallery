<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="iconapp.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIVATE MODE</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #ff1500;
      font-family: sans-serif;
      text-align: center;
    }

    #logo {
      width: 70%;
      max-width: 100%;
      margin: 20px auto;
      display: block;
    }

    .game-container {
      display: none;
      margin: 20px auto;
      max-width: 1750px;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #0c0c0c;
    }

    #twegallery-m-container canvas {
      width: 90%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    #Mtwegallery-m-container canvas {
      width: 90%;
      height: auto;
      aspect-ratio: 9 / 16;
    }

    .loading-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90px;
      height: 90px;
      transform: translate(-50%, -50%);
      animation: spin 4s linear infinite;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>

  <img id="logo" src="twegall-logo.png" alt="Logo">

  <div id="twegallery-m-container" class="game-container">
    <img src="loading-logo.png" class="loading-logo" id="desktop-loading-logo" alt="Loading">
    <canvas id="twegallery-m-canvas"></canvas>
  </div>

  <div id="Mtwegallery-m-container" class="game-container">
    <img src="loading-logo.png" class="loading-logo" id="mobile-loading-logo" alt="Loading">
    <canvas id="Mtwegallery-m-canvas"></canvas>
  </div>

  <script>
    let unityInstance = null;
    let currentPlatform = null;
    let currentLoaderScript = null;

    function unloadUnity() {
      const quitPromise = unityInstance ? unityInstance.Quit() : Promise.resolve();

      return quitPromise.then(() => {
        unityInstance = null;

        if (currentLoaderScript) {
          currentLoaderScript.remove();
          currentLoaderScript = null;
        }

        if (typeof createUnityInstance !== "undefined") {
          createUnityInstance = undefined;
        }
      });
    }

    function initUnity(canvasId, loaderUrl, dataUrl, frameworkUrl, codeUrl, productName, logoId) {
      return new Promise((resolve, reject) => {
        const canvas = document.getElementById(canvasId);
        const loadingLogo = document.getElementById(logoId);

        if (!canvas) {
          reject(new Error("Canvas not found: " + canvasId));
          return;
        }

        if (!loadingLogo) {
          reject(new Error("Loading logo not found: " + logoId));
          return;
        }

        loadingLogo.style.display = "block";

        const loaderScript = document.createElement("script");
        loaderScript.src = loaderUrl;
        loaderScript.async = true;

        loaderScript.onload = () => {
          if (typeof createUnityInstance !== "function") {
            loadingLogo.style.display = "none";
            reject(new Error("createUnityInstance not found after loading " + loaderUrl));
            return;
          }

          createUnityInstance(canvas, {
            dataUrl: dataUrl,
            frameworkUrl: frameworkUrl,
            codeUrl: codeUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: productName,
            productVersion: "0.1"
          })
          .then(instance => {
            unityInstance = instance;
            currentLoaderScript = loaderScript;
            loadingLogo.style.display = "none";
            resolve(instance);
          })
          .catch(err => {
            loadingLogo.style.display = "none";
            console.error("Unity failed to load:", err);
            reject(err);
          });
        };

        loaderScript.onerror = () => {
          loadingLogo.style.display = "none";
          reject(new Error("Failed to load loader script: " + loaderUrl));
        };

        document.body.appendChild(loaderScript);
      });
    }

    function checkScreen() {
      const isDesktop = window.innerWidth > 768;

      const desktopContainer = document.getElementById("twegallery-m-container");
      const mobileContainer = document.getElementById("Mtwegallery-m-container");

      if (isDesktop) {
        desktopContainer.style.display = "block";
        mobileContainer.style.display = "none";

        if (currentPlatform !== "desktop") {
          unloadUnity().then(() => {
            return initUnity(
              "twegallery-m-canvas",
              "twegallery-m.loader.js",
              "twegallery-m.data",
              "twegallery-m.framework.js",
              "twegallery-m.wasm",
              "twegallery-m",
              "desktop-loading-logo"
            );
          }).then(() => {
            currentPlatform = "desktop";
          }).catch(console.error);
        }
      } else {
        desktopContainer.style.display = "none";
        mobileContainer.style.display = "block";

        if (currentPlatform !== "mobile") {
          unloadUnity().then(() => {
            return initUnity(
              "Mtwegallery-m-canvas",
              "Mtwegallery-m.loader.js",
              "Mtwegallery-m.data",
              "Mtwegallery-m.framework.js",
              "Mtwegallery-m.wasm",
              "Mtwegallery-m",
              "mobile-loading-logo"
            );
          }).then(() => {
            currentPlatform = "mobile";
          }).catch(console.error);
        }
      }
    }

    checkScreen();
    window.addEventListener("resize", checkScreen);
  </script>

</body>
</html>
